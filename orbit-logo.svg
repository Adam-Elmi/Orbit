<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3278"/>
      <stop offset="1" stop-color="#1B1D4A"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F2A93B"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <g transform="rotate(-20 512 512)">
    <!-- Back half of orbit + inactive sessions -->
    <ellipse cx="512" cy="512" rx="400" ry="140" fill="none" stroke="#B8BDF5" stroke-opacity="0.55" stroke-width="26"/>
    <circle cx="166" cy="442" r="28" fill="#B8BDF5"/>
    <circle cx="712" cy="391" r="24" fill="#B8BDF5" fill-opacity="0.8"/>
  </g>

  <!-- Planet: the result -->
  <circle cx="512" cy="512" r="190" fill="url(#planet)"/>
  <rect x="424" y="456" width="176" height="38" rx="19" fill="#1B1D4A"/>
  <rect x="424" y="530" width="176" height="38" rx="19" fill="#1B1D4A"/>

  <g transform="rotate(-20 512 512)">
    <!-- Front half of orbit + active session -->
    <path d="M112 512 A400 140 0 0 0 912 512" fill="none" stroke="#B8BDF5" stroke-width="26" stroke-linecap="round"/>
    <circle cx="858" cy="582" r="50" fill="#6EE7C8" stroke="#1B1D4A" stroke-width="14"/>
  </g>
</svg>
