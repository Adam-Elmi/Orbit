[package]
name = "orbit"
version = "1.0.0"
description = "A calculator with sessions you slide between"
authors = ["Adam Elmi"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2"
